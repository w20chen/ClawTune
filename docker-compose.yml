services:
  sidecar:
    # On ARM/Kunpeng hosts, uncomment the line below to force the service
    # image/runtime platform.  The base image (python:3.12-slim) is multi-arch
    # and resolves to the host architecture automatically when platform is not
    # specified.
    # platform: linux/arm64
    build:
      context: ./services/sidecar
    command: ["python", "-m", "clawtune_sidecar.main", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      CLAWTUNE_DB_PATH: /data/sidecar.sqlite3
      CLAWTUNE_POLICY: observe-only
      CLAWTUNE_TOOL_RESOURCE_TRACES: /data/traces
      CLAWTUNE_TOOL_RESOURCE_EBPF_TRACES: /data/tool-resource
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./examples:/config:ro
      - ./data:/data
