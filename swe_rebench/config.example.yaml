# SWE-Rebench Integration Configuration
# ======================================
# This file configures the OpenClaw + sidecar trace collection inside
# swe-rebench Docker containers.  Each task runs in its own container
# with an isolated trace output.

# ── LLM Provider ──────────────────────────────────────────────────
runtime:
  # OpenClaw and the privileged sidecar run on the host; tools execute in
  # OpenClaw's Docker sandbox.
  mode: "host-openclaw-sandbox"

  # eBPF clause telemetry is the purpose of this project and fails closed by
  # default. Set false only for an explicit troubleshooting run whose output
  # is not accepted as complete telemetry.
  ebpf_required: true

llm:
  # API key for the upstream LLM provider (required)
  # The sidecar proxies requests and records them, then forwards here.
  # Resolution order:
  #   1. api_key / ${LLM_API_KEY}
  #   2. api_key_file (defaults to ./swe_rebench/llm_api_key.txt)
  #   3. repo .env line: LLM_API_KEY=...
  api_key: "${LLM_API_KEY}"
  api_key_file: "./swe_rebench/llm_api_key.txt"

  # Upstream base URL.  Default: DeepSeek.
  upstream_base_url: "https://api.deepseek.com"

  # Model ID as known to the upstream provider.
  model: "deepseek-v4-flash"

  # How OpenClaw refers to the model internally (vllm/<model>).
  openclaw_model_ref: "vllm/deepseek-v4-flash"

# ── Docker ─────────────────────────────────────────────────────────
docker:
  # Docker daemon socket or host.
  host: "unix:///var/run/docker.sock"
  # On ARM/Kunpeng hosts running official x86_64 swe-rebench images through
  # QEMU, set this to "linux/amd64" after running:
  #   sudo bash scripts/setup/arm_qemu_setup.sh install
  # You can also override this with SWE_REBENCH_DOCKER_PLATFORM=linux/amd64.
  platform: ""

  # Per-container resource limits.
  memory_limit: "8g"
  cpus: 4

  # Network mode.  "bridge" (default) gives each container its own net ns.
  # "host" may be needed for some swe-rebench images.
  network_mode: "bridge"

  # Extra DNS servers (optional).
  dns_servers: []

  # Pull policy: "always", "missing" (default), "never".
  pull_policy: "missing"

  # Extra capabilities to grant (e.g. ["SYS_PTRACE"]).
  cap_add: []

  # Enable these when you need complete per-tool cgroup v2 sampling.
  # They grant the task container write access to cgroupfs so claw-launch can
  # create /sys/fs/cgroup/claw/<execution_id> instead of borrowing the
  # container root cgroup.
  privileged: true
  cgroupns_mode: "host"
  cgroup_mount_rw: true
  # Strict default: do not accept a shared/root cgroup fallback as complete
  # per-tool telemetry.
  cgroup_required: true

# ── Batch Execution ───────────────────────────────────────────────
batch:
  # Whole-task wall-clock budget in seconds, including repository export,
  # preflight, agent execution, and normal result collection. 0 = no limit.
  task_timeout_seconds: 1800

  # Optional additional limit for only the OpenClaw agent phase. The smaller
  # of this and the remaining whole-task budget wins. 0 = no separate limit.
  agent_timeout_seconds: 0

  # Retry failed tasks up to this many times.
  retry_failed: 0

  # Continue running remaining tasks when one fails.
  continue_on_error: true

# ── Output ────────────────────────────────────────────────────────
output:
  # Root directory for per-task trace output.
  # Each task creates a subdirectory: <trace_root>/<task_id>/
  trace_root: "./swe_rebench/.runtime/traces"

  # Summary report written after the batch completes.
  report_path: "./swe_rebench/.runtime/report.json"

  # Also copy the final trace.jsonl to a flat directory keyed by task ID.
  # Set to empty string to disable.
  flat_export_dir: "./swe_rebench/.runtime/export"

# ── Runtime Bundle ────────────────────────────────────────────────
bundle:
  # Source directories (relative to repo root).
  plugin_source: "packages/openclaw-plugin"
  scheduler_source: "services/scheduler"

  # Generated runtime files stay outside the Git-tracked bundle template.
  output_dir: "swe_rebench/.runtime/bundle"

# ── Agent ─────────────────────────────────────────────────────────
agent:
  # Extra arguments passed to `openclaw agent`.
  extra_args: []
