bind: 127.0.0.1
port: 8765
policy: observe-only
max_global_concurrency: 4
lease_ttl_ms: 300000
admission_wait_ms: 5000
db_path: ./traces/sidecar.sqlite3
tool_resource_trace_paths:
  - ./traces
tool_resource_ebpf_trace_paths:
  - ./traces/tool-resource-ebpf
tool_resource_latency_buckets_ms:
  - 100
  - 500
  - 2000
  - 10000
# KV-TTL policy (seconds). One entry per latency bucket, including the
# open-ended tail. TTLs are absolute times relative to tool start. At runtime,
# crossing a boundary selects the next bucket's TTL. Legacy four-value policies
# imply a zero TTL for the tail bucket. Values may be zero (immediate eviction).
tool_resource_ttl_by_bucket_s:
  - 0.1
  - 0.5
  - 2.0
  - 0.0
  - 0.0
# Optional miss penalty (seconds) added to the proxy cost on a KV cache miss.
tool_resource_miss_penalty_s: 2.0
tool_resource_repo: openclaw
tool_resource_artifact_dir: ./traces/tool-resource
tool_resource_container_executable: docker
