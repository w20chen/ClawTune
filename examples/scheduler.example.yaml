bind: 127.0.0.1
port: 8765
policy: observe-only
max_global_concurrency: 4
lease_ttl_ms: 300000
admission_wait_ms: 5000
db_path: ./traces/scheduler.sqlite3
tool_resource_trace_paths:
  - ./traces
tool_resource_stage2_trace_paths:
  - ./traces/tool-resource-stage2
tool_resource_latency_buckets_ms:
  - 100
  - 500
  - 2000
  - 10000
# KV-TTL cost proxy policy (seconds).  One entry per latency bucket edge.
# Each entry is the KV TTL for the corresponding prediction bucket.  When
# omitted, TTL defaults to the bucket upper bound in seconds (0.1, 0.5, 2.0,
# 10.0 for the default latency edges above).  Values may be zero.
tool_resource_ttl_by_bucket_s:
  - 0.1
  - 0.5
  - 2.0
  - 10.0
# Optional miss penalty (seconds) added to the proxy cost on a KV cache miss.
tool_resource_miss_penalty_s: 2.0
tool_resource_repo: openclaw
tool_resource_artifact_dir: ./traces/tool-resource
tool_resource_container_executable: docker
